# dsh-plugin-forecast-lite — capa bundle de DSH.
# Inserta una fila @deepseek-ai/dsh-mcp-client que lanza el servidor como "forecast".
# Tools resultantes: mcp__forecast__* (ver README).
- insert:
    - id: mcp-forecast-lite
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: forecast
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js "(process.env.DSH_HOME && process.env.DSH_HOME.trim() !== '' ? process.env.DSH_HOME : (process.env.USERPROFILE || process.env.HOME || '') + '/.dsh') + '/plugins/forecast-lite/server.mjs'"
        env:
          ELECTRON_RUN_AS_NODE: '1'
        failOnStartupError: false
        toolCallTimeoutMs: 60000
